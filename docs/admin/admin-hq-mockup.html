<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Design reference for docs/admin/DAYLIE_ADMIN_DASHBOARD.md. All numbers are SAMPLE data. -->
<title>Daylie 운영실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: app shell — left menu (top tab row on phones) + one view at a time.
   Home mixes A (one-line story), D (to-do inbox), B (KPI strip + sparklines); 성장 = C; 가족 = B table.
   Tokens are the Daylie app tokens (styles.css :root). Light only, by the owner's choice. */
:root{
  color-scheme: light;
  --ground:#EAF6F0; --surface:#FFFFFF; --surface-dim:#F4F8F6; --ink:#2C3A33; --muted:#4F6A5E; --line:#CFE3D8;
  --accent:#FF8A1F; --accent-tint:#FFF0DC; --accent-line:#FFD9A6; --accent-pressed:#F07A0E; --accent-ink:#8A4300;
  --good:#1F9D55; --good-tint:#E3F4EA; --danger:#D93D42; --danger-tint:#FDECEC;
  --f:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-card:20px; --r-btn:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── shell ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  padding-left:max(14px, env(safe-area-inset-left, 0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--ink)}
.brand b{font-size:17px;font-weight:800;display:block}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:12px;font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap}
.nav button:hover{background:var(--surface-dim)}
.nav button[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink)}
.nav .badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.nav .soft{background:var(--surface-dim);color:var(--muted)}
.side .foot{margin-top:auto;padding:14px 12px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.side .foot .live{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:13px;margin-bottom:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-tint);flex:none}
.dot.bad{background:var(--danger);box-shadow:0 0 0 4px var(--danger-tint)}

.main{min-width:0;padding-block:26px 56px;padding-left:max(16px, min(4vw,40px));padding-right:max(16px, env(safe-area-inset-right, 0px), min(4vw,40px))}
.view{display:flex;flex-direction:column;gap:18px;max-width:1180px;margin:0 auto}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.vhead .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.vhead small{font-size:14px;font-weight:700;color:var(--muted)}
.vhead h1{font-size:clamp(22px,2.8vw,30px);font-weight:800;letter-spacing:-.015em;line-height:1.3}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.card{background:var(--surface);border-radius:var(--r-card);padding:18px 20px;min-width:0}
.card h3{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card h3 small{font-size:13px;font-weight:700;color:var(--muted)}
.link{all:unset;cursor:pointer;font-size:13.5px;font-weight:800;color:var(--accent-ink)}
.link:hover{text-decoration:underline}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.t-acc{background:var(--accent-tint);color:var(--accent-ink)}
.t-good{background:var(--good-tint);color:#17733F}
.t-bad{background:var(--danger-tint);color:#A82A2E}
.t-dim{background:var(--surface-dim);color:var(--muted)}
.sample{font-size:12px;color:var(--muted)}

/* ── home: story + north star ── */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.story{background:var(--surface);border-radius:var(--r-card);padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.story p.big{font-size:clamp(20px,2.4vw,27px);font-weight:800;line-height:1.45;letter-spacing:-.01em}
.story em{font-style:normal;background:var(--accent-line);border-radius:8px;padding:0 6px}
.story .chips{display:flex;gap:8px;flex-wrap:wrap}
.north{background:var(--ink);color:#fff;border-radius:var(--r-card);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.north small{color:#CFE3D8;font-size:13px;font-weight:700}
.north .v{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.north .v span{font-size:18px;color:#CFE3D8;font-weight:700}
.north p{font-size:13.5px;color:#DCEBE3}
.north svg{width:100%;height:56px}
.north .goal{display:flex;justify-content:space-between;font-size:12.5px;color:#CFE3D8}

/* ── KPI strip ── */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .k{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--good)} .down{color:var(--danger)} .flat{color:var(--muted)}
.kpi svg{width:100%;height:30px;margin-top:6px}

/* ── inbox ── */
.inbox{display:flex;flex-direction:column}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-radius:14px}
.it + .it{margin-top:2px}
.it:hover{background:var(--surface-dim)}
.it[aria-selected="true"]{background:var(--accent-tint)}
.it .stripe{flex:none;width:5px;align-self:stretch;border-radius:3px}
.s-now{background:var(--danger)} .s-day{background:var(--accent)} .s-wk{background:var(--line)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-size:15px;font-weight:800;line-height:1.4}
.it .tx small{display:block;font-size:13px;color:var(--muted)}
.it .cat{flex:none;font-size:11.5px;font-weight:800;color:var(--muted);background:var(--surface-dim);border-radius:7px;padding:3px 8px}
.grp{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
.grp:first-child{padding-top:0}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* ── system mini ── */
.rows{display:flex;flex-direction:column}
.rows > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rows > div:last-child{border-bottom:0}
.rows b{font-weight:800}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px}

/* ── money mini ── */
.money{display:flex;flex-direction:column;gap:12px}
.money .line{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.money .line b{font-weight:800}
.meter{height:12px;border-radius:999px;background:var(--surface-dim);overflow:hidden;display:flex}
.meter span{display:block;height:100%}

/* ── bars ── */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars span{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--accent-line)}
.bars .hi span{background:var(--accent)}
.bars small{font-size:11.5px;color:var(--muted)}
.bars em{font-style:normal;font-size:11px;font-weight:800}

/* ── inbox page ── */
.ibx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
.detail{display:flex;flex-direction:column;gap:14px}
.detail .crumb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.detail h2{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.015em}
.detail .why{font-size:15px;max-width:56ch}
.who{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.who div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.who div:last-child{border-bottom:0}
.who span{color:var(--muted);font-size:13px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-btn);padding:11px 16px;font-size:14.5px;font-weight:800;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.pri:hover{background:var(--accent-pressed);border-color:var(--accent-pressed)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rules div{background:var(--surface-dim);border-radius:14px;padding:12px 14px;font-size:13.5px;min-width:0}
.rules b{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:2px}
.rules b i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ── growth ── */
.funnel{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center}
.fr .lab{font-weight:800;font-size:14.5px;word-break:keep-all}
.fr .track{height:34px;background:var(--surface-dim);border-radius:10px;overflow:hidden}
.fr .fill{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:12px;font-weight:800;font-size:14px;color:var(--ink)}
.fr .pct{font-size:13px;font-weight:800;text-align:right;color:var(--muted)}
.fr.leak .pct{color:var(--danger)}
.fr.wait .fill{background:repeating-linear-gradient(135deg,var(--surface-dim) 0 8px,var(--line) 8px 10px)!important;color:var(--muted)}
.callout{display:flex;gap:16px;align-items:center;background:var(--danger-tint);border-radius:16px;padding:14px 18px;flex-wrap:wrap}
.callout .big{font-size:34px;font-weight:800;color:var(--danger);line-height:1}
.callout p{flex:1;min-width:220px;font-size:14.5px}
.cohort{display:grid;grid-template-columns:minmax(96px,auto) repeat(5,minmax(0,1fr));gap:5px;font-size:12.5px;align-items:center}
.cohort .h{color:var(--muted);text-align:center;font-weight:700}
.cohort .r{font-weight:700;white-space:nowrap}
.cohort .cell{border-radius:8px;text-align:center;padding:8px 0;font-weight:800;font-size:13px}
.src{display:flex;flex-direction:column;gap:12px}
.src div{display:grid;grid-template-columns:100px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:14px}
.src .bar{height:16px;border-radius:8px;background:var(--accent)}
.src b{text-align:right;font-weight:800;font-size:13.5px}
.trend svg{width:100%;height:200px;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ── families table ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:800}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{flex:1;min-width:180px;max-width:320px;margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:800;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-dim)}
.plan{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:7px;padding:2px 8px}

/* ── revenue ── */
.banner{display:flex;gap:14px;align-items:center;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:16px;padding:14px 18px;flex-wrap:wrap}
.banner p{flex:1;min-width:240px;font-size:14.5px}
.calc{display:flex;flex-direction:column;gap:10px}
.calc .row{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px}
.calc .row.h{font-size:12.5px;font-weight:800;color:var(--muted)}
.calc input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface-dim);font-variant-numeric:tabular-nums;min-width:0}
.calc .out{text-align:right;font-weight:800}
.wf{display:flex;flex-direction:column}
.wf div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.wf div:last-child{border-bottom:0;font-size:17px;font-weight:800}
.wf .neg{color:var(--danger)}
.mix{display:flex;height:28px;border-radius:10px;overflow:hidden}
.mix span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap}
.trig{display:flex;flex-direction:column;gap:10px}
.trig div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-dim);font-size:14.5px}
.trig div b{font-size:20px;font-weight:800}

/* ── system ── */
.beats{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:3px}
.beats i{height:26px;border-radius:3px;background:var(--good)}
.beats i.miss{background:var(--danger)}
.beats i.slow{background:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.vers{display:flex;flex-direction:column;gap:10px}
.vers div{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.vers .bar{height:12px;border-radius:6px;background:var(--muted)}
.vers b{text-align:right}

/* ── flags ── */
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.flag{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-dim);min-width:0}
.flag div{min-width:0}
.flag b{display:block;font-size:14.5px}
.flag code{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.sw{all:unset;cursor:pointer;flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{left:23px}
@media (prefers-reduced-motion:no-preference){ .sw::after{transition:left .15s} .sw{transition:background .15s} }

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:20}

/* ── responsive ── */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3){border-right:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;gap:10px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:0 6px 0 0}
  .brand span{display:none}
  .nav{flex-direction:row}
  .nav button{padding:9px 12px}
  .side .foot{display:none}
  .hero,.g-2,.g-2e,.g-3,.ibx{grid-template-columns:1fr}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0!important}
  .kpi:last-child{grid-column:1 / -1;border-bottom:0}
  .fr{grid-template-columns:96px minmax(0,1fr) 64px;gap:8px}
  .src div{grid-template-columns:84px minmax(0,1fr) 60px}
  .calc .row{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 84px;gap:6px}
  .beats{gap:2px}
  .north .v{font-size:38px}
}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand"><i>D</i><span><b>Daylie 운영실</b><small>Simple · 베타</small></span></div>
    <nav class="nav" id="nav" aria-label="운영실 메뉴"></nav>
    <div class="foot">
      <div class="live"><span class="dot"></span>메모 서버 정상</div>
      마지막 신호 22초 전 · 화면의 숫자는 예시
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ko-KR');
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

function spark(d,c,{h=30,fillO=.12,stroke=1.8,goal=null}={}){
  const lo=Math.min(...d,goal??Infinity), hi=Math.max(...d,goal??-Infinity), r=(hi-lo)||1, W=100;
  const Y=v=>h-3-((v-lo)/r)*(h-8);
  const pts=d.map((v,i)=>[(i/(d.length-1)*W).toFixed(2), Y(v).toFixed(2)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const last=pts[pts.length-1];
  const g = goal!=null?`<line x1="0" x2="${W}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="${c}" stroke-opacity=".45" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:'';

function inboxList(limit){
  const open=INBOX.filter(i=>!resolved.has(i.id));
  if(!open.length) return '<div class="empty">처리할 일이 없어요. 오늘은 여기까지!</div>';
  const groups=[['now','지금','s-now'],['day','오늘','s-day'],['wk','이번 주','s-wk']];
  let out='',shown=0;
  for(const [k,label,cls] of groups){
    const items=open.filter(i=>i.when===k).slice(0, limit? Math.max(0,limit-shown):99);
    if(!items.length) continue;
    out+=`<div class="grp">${label}</div>`;
    out+=items.map(i=>`<button type="button" class="it" data-it="${i.id}" ${limit?'':(i.id===selected?'aria-selected="true"':'aria-selected="false"')}><span class="stripe ${cls}"></span><span class="tx"><b>${i.t}</b><small>${i.s}</small></span><span class="cat">${i.cat}</span></button>`).join('');
    shown+=items.length;
    if(limit && shown>=limit) break;
  }
  return out;
}

function revCalc(){
  let total=0;
  for(const k of Object.keys(PRICES)){
    const p=+($('#p-'+k).value.replace(/\D/g,''))||0, f=+($('#f-'+k).value.replace(/\D/g,''))||0;
    PRICES[k].p=p; PRICES[k].f=f; total+=p*f;
    $(`[data-out="${k}"]`).textContent=won(p*f);
  }
  const vat=total/11, fee=(total-vat)*0.15, net=total-vat-fee-COST_MONTH;
  $('[data-wf]').innerHTML=`<div><span>월 매출</span><b class="num">${won(total)}</b></div><div><span>부가세 10%</span><b class="num neg">− ${won(vat)}</b></div><div><span>Apple·Google 수수료 15%</span><b class="num neg">− ${won(fee)}</b></div><div><span>운영 비용</span><b class="num neg">− ${won(COST_MONTH)}</b></div><div><span>남는 돈</span><span class="num" style="color:${net>=0?'var(--good)':'var(--danger)'}">${won(net)}</span></div>`;
  const fam=Object.values(PRICES).map(t=>t.f), free=Math.max(0,186-fam.reduce((a,b)=>a+b,0));
  const parts=[['Free',free,'var(--surface-dim)'],['Basic',fam[0],'var(--accent-line)'],['Plus',fam[1],'var(--accent)'],['Family',fam[2],'var(--ink)']];
  const all=parts.reduce((s,p)=>s+p[1],0)||1;
  $('[data-mix]').innerHTML=parts.filter(p=>p[1]>0).map(p=>`<span style="width:${p[1]/all*100}%;background:${p[2]};color:${p[0]==='Family'?'#fff':'var(--ink)'}">${p[1]/all>.08?p[0]:''}</span>`).join('');
  $('[data-mixnote]').textContent=parts.map(p=>`${p[0]} ${p[1]}`).join(' · ')+` · 유료 전환 ${Math.round((all-free)/all*100)}%`;
}

/* ───────── render ───────── */
function hours(){
  const h=[0,0,0,0,0,6,38,96,170,212,150,120,104,92,80,74,66,52,40,30,22,14,8,0];
  const max=212;
  return h.slice(5,23).map((v,i)=>`<div class="${i+5===9?'hi':''}"><em class="num">${i+5===9?v:''}</em><span style="height:${Math.max(3,Math.round(v/max*110))}px"></span><small class="num">${(i+5)%3===0?(i+5)+'시':''}</small></div>`).join('');
}
function cohort(){
  const co=[['9/22 주 · 48명',[100,78,69,64,61]],['9/29 주 · 55명',[100,81,72,66]],['10/6 주 · 61명',[100,76,70]],['10/13 주 · 50명',[100,80]]];
  let o='<span></span>'+['첫 주','1주 후','2주 후','3주 후','4주 후'].map(h=>`<span class="h">${h}</span>`).join('');
  co.forEach(([l,vs])=>{o+=`<span class="r">${l}</span>`;for(let k=0;k<5;k++){const v=vs[k];o+=v==null?'<span></span>':`<span class="cell num" style="background:rgba(255,138,31,${(0.12+(v-55)/45*0.7).toFixed(2)})">${v}%</span>`;}});
  return o;
}
function trend(){
  const n=90, act=[], fam=[];
  for(let i=0;i<n;i++){ act.push(Math.round(30+i*1.36+Math.sin(i/3)*4)); fam.push(Math.round(20+i*1.85)); }
  act[n-1]=152; fam[n-1]=186;
  const W=900,H=200,t=12,b=176,maxY=200,Y=v=>b-(v/maxY)*(b-t),X=i=>40+i/(n-1)*(W-52);
  let g='';
  [0,50,100,150,200].forEach(v=>{g+=`<line x1="40" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" stroke="#CFE3D8" stroke-width="1"/><text x="32" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#4F6A5E">${v}</text>`;});
  ['7월 26일','8월 25일','9월 24일','10월 23일'].forEach((l,i)=>{const xi=X(Math.round(i*(n-1)/3));g+=`<text x="${xi}" y="${H-4}" text-anchor="${i===0?'start':i===3?'end':'middle'}" font-size="11" fill="#4F6A5E">${l}</text>`;});
  const p=s=>s.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  g+=`<polygon points="${X(0)},${b} ${p(act)} ${X(n-1)},${b}" fill="#FF8A1F" fill-opacity=".12"/>`;
  g+=`<polyline points="${p(fam)}" fill="none" stroke="#4F6A5E" stroke-width="2" stroke-dasharray="5 4"/>`;
  g+=`<polyline points="${p(act)}" fill="none" stroke="#FF8A1F" stroke-width="2.5"/>`;
  g+=`<circle cx="${X(n-1)}" cy="${Y(152)}" r="5" fill="#FF8A1F"/><text x="${X(n-1)-8}" y="${Y(152)-10}" text-anchor="end" font-size="12" font-weight="800" fill="#2C3A33">152</text>`;
  g+=`<circle cx="${X(n-1)}" cy="${Y(186)}" r="4" fill="#4F6A5E"/><text x="${X(n-1)-8}" y="${Y(186)-8}" text-anchor="end" font-size="12" font-weight="800" fill="#2C3A33">186</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="90일 동안 활동 부모님과 누적 가족 추세 (예시)">${g}</svg>`;
}
function beats(){
  let o='';for(let i=0;i<60;i++){o+=`<i class="${i===23?'miss':(i>=34&&i<=38)?'slow':''}" title="${60-i}분 전"></i>`;}return o;
}

function render(){
  renderNav();
  $('#main').innerHTML=`<div class="view">${V[current]()}</div>`;
  document.querySelectorAll('[data-hours]').forEach(e=>e.innerHTML=hours());
  const c=$('[data-cohort]'); if(c) c.innerHTML=cohort();
  const t=$('[data-trend]'); if(t) t.innerHTML=trend();
  const bt=$('[data-beats]'); if(bt) bt.innerHTML=beats();
  if(current==='families') $('[data-rows]').innerHTML=famRows();
  if(current==='revenue') revCalc();
}
function go(v){ if(!V[v]) v='today'; current=v; render(); window.scrollTo({top:0}); try{ if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);}catch(e){} }

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-v]'); if(n){go(n.dataset.v);return;}
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  const r=e.target.closest('[data-range]'); if(r){range=r.dataset.range;render();return;}
  const it=e.target.closest('[data-it]'); if(it){selected=it.dataset.it; if(current!=='inbox') go('inbox'); else render(); return;}
  const d=e.target.closest('[data-done]'); if(d){resolved.add(d.dataset.done); toast('해결됨으로 옮겼어요'); render(); return;}
  const a=e.target.closest('[data-act]'); if(a){toast(`“${a.textContent}” — 예시 화면이라 실제로 보내지는 않아요`); return;}
  const f=e.target.closest('[data-f]'); if(f){famFilter=f.dataset.f; document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b===f)); $('[data-rows]').innerHTML=famRows(); return;}
  const s=e.target.closest('[data-flag]'); if(s){const i=+s.dataset.flag; FLAGS[i][2]=!FLAGS[i][2]; s.setAttribute('aria-checked',FLAGS[i][2]); toast(`${FLAGS[i][1]} ${FLAGS[i][2]?'켬':'끔'} · 예시라 앱은 그대로예요`); return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='famq'){famQ=e.target.value.trim(); $('[data-rows]').innerHTML=famRows();}
  if(e.target.closest('[data-calc]')) revCalc();
});
const h=(location.hash||'').slice(1);
go(VIEWS.some(v=>v.id===h)?h:'today');
})();
</script>
